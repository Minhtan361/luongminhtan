<html lang="vi">
<head>
    <link rel="icon" href="https://minhtan361.github.io/luongminhtan/logo/favicon.ico" type="image/x-icon">

<link rel="icon" type="image/png" sizes="16x16" href="https://minhtan361.github.io/luongminhtan/logo/favicon-16x16.png">

<link rel="icon" type="image/png" sizes="60x60" href="https://minhtan361.github.io/luongminhtan/logo/favicon-60x60.png">

<link rel="icon" type="image/png" sizes="120x120" href="https://minhtan361.github.io/luongminhtan/logo/favicon-120x120.png">
<link rel="icon" type="image/png" sizes="144x144" href="https://minhtan361.github.io/luongminhtan/logo/favicon-144x144.png">
<link rel="icon" type="image/png" sizes="152x152" href="https://minhtan361.github.io/luongminhtan/logo/favicon-152x152.png">
<link rel="icon" type="image/png" sizes="180x180" href="https://minhtan361.github.io/luongminhtan/logo/favicon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://minhtan361.github.io/luongminhtan/logo/favicon-192x192.png">
<link rel="icon" type="image/png" sizes="256x256" href="https://minhtan361.github.io/luongminhtan/logo/favicon-256x256.png">
<link rel="icon" type="image/png" sizes="384x384" href="https://minhtan361.github.io/luongminhtan/logo/favicon-384x384.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://minhtan361.github.io/luongminhtan/logo/favicon-512x512.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vuýp MinhTan</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thiết lập cấu hình Tailwind để sử dụng Font Inter và màu sắc tùy chỉnh -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary-blue': '#1e40af', // Xanh dương đậm
                        'secondary-gray': '#f3f4f6', // Xám nhạt
                        'hover-blue': '#1d4ed8', // Xanh dương khi hover
                    }
                }
            }
        }
    </script>
    <style>
        /* Đảm bảo Font Inter được tải */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        /* CSS cho nền 3D */
        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Nâng cấp hiệu ứng cho thẻ ứng dụng */
        .app-card {
            /* Hiệu ứng thủy tinh mờ (Glassmorphism) */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease-in-out;
            border-radius: 1rem; /* Tăng bo góc */
        }
        .app-card:hover {
            background: rgba(255, 255, 255, 0.2);
            /* Hiệu ứng viền phát sáng sắc sảo hơn */
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.25); 
            border-color: rgba(0, 229, 255, 0.5);
            transform: translateY(-5px) scale(1.02);
        }

        /* Nâng cấp tiêu đề với hiệu ứng gradient */
        .gradient-text {
            color: #ffffff; /* Màu dự phòng cho trình duyệt cũ */
            background: linear-gradient(90deg, #e0e0e0, #ffffff, #e0e0e0); /* Sáng và tương phản hơn */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* CSS cho iframe ứng dụng */
        .app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
            display: none;
        }
        
        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .close-app {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1001;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }
        
        .close-app:hover {
            background: rgba(0,0,0,0.9);
        }
    </style>
    <!-- Thư viện cho hiệu ứng nền 3D Vanta.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Vùng chứa cho hiệu ứng nền 3D -->
    <div id="vanta-bg"></div>

    <!-- Container cho ứng dụng chấm công -->
    <div id="chamcong-container" class="app-container">
        <button class="close-app" data-target="chamcong-container">×</button>
        <iframe id="chamcong-iframe" class="app-iframe" src="about:blank"></iframe>
    </div>

    <!-- Container cho ứng dụng lịch làm -->
    <div id="lichlam-container" class="app-container">
        <button class="close-app" data-target="lichlam-container">×</button>
        <iframe id="lichlam-iframe" class="app-iframe" src="about:blank"></iframe>
    </div>

    <!-- Container cho ứng dụng nhập liệu -->
    <div id="nhaplieu-container" class="app-container">
        <button class="close-app" data-target="nhaplieu-container">×</button>
        <iframe id="nhaplieu-iframe" class="app-iframe" src="about:blank"></iframe>
    </div>

    <!-- Container cho ứng dụng thu chi -->
    <div id="thuchi-container" class="app-container">
        <button class="close-app" data-target="thuchi-container">×</button>
        <iframe id="thuchi-iframe" class="app-iframe" src="about:blank"></iframe>
    </div>

    <div class="w-full max-w-5xl">
        <!-- Tiêu đề và Mô tả -->
        <header class="text-center mb-12">
            <h1 class="gradient-text text-5xl font-extrabold tracking-tight mb-2">
                Minh Tan Dashboard Vuýp ✨
            </h1>
            <p class="text-xl text-gray-200 mt-3">
                Cổng thông tin tập trung cho các ứng dụng nội bộ.
            </p>
        </header>

        <!-- Lưới các Hộp Chức Năng (App Boxes) -->
        <div id="app-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dữ liệu được nhúng trong JS script để dễ dàng quản lý -->
        </div>

        <!-- Chân trang -->
        <footer class="text-center mt-12 text-gray-400 text-sm">
            &copy; 2025 Minh Tan Apps. Vui lòng liên hệ IT nếu có vấn đề.
        </footer>
    </div>

    <script>
        // Danh sách các ứng dụng
        const apps = [
            {
                name: "Từ từ",
                description: "Ứng dụng theo dõi giờ làm và chấm công hàng ngày.",
                url: "https://minhtan361.github.io/",
                icon: "📅", // Icon cho Chấm Công
                embeddable: true, // Đánh dấu có thể nhúng
                containerId: "chamcong-container",
                iframeId: "chamcong-iframe"
            },
            {
                name: "Lịch Làm Việc",
                description: "Quản lý lịch làm việc của nhân viên.",
                url: "https://minhtan361.github.io/minhtan361/",
                icon: "🗓️", // Icon cho Lịch Làm
                embeddable: true,
                containerId: "lichlam-container",
                iframeId: "lichlam-iframe"
            },
            {
                name: "Nguyên Liệu Nhập",
                description: "Quản lý nhập liệu nguyên liệu hải sản - thịt.",
                url: "https://minhtan361.github.io/nhapnguyenlieu/",
                icon: "📦", // Icon cho Nguyên Liệu
                embeddable: true,
                containerId: "nhaplieu-container",
                iframeId: "nhaplieu-iframe"
            },
            {
                name: "Tích điểm",
                description: "Sổ thu chi kế toán hằng ngày.",
                url: "https://minhtan361.github.io/Thu-Chi-H-ng-Ng-y/",
                icon: "💰", // Icon cho Thu Chi
                embeddable: true,
                containerId: "thuchi-container",
                iframeId: "thuchi-iframe"
            }
        ];

        const appGrid = document.getElementById('app-grid');

        // Hàm tạo Hộp Chức Năng (App Box)
        function createAppBox(app) {
            const card = document.createElement('div');
            
            // Thiết lập Tailwind classes cho card
            card.className = "app-card block p-6 cursor-pointer";
            
            // Nội dung của card
            card.innerHTML = `
                <div class="text-5xl mb-4">${app.icon}</div>
                <h2 class="text-xl font-bold text-gray-100 mb-2">${app.name}</h2>
                <p class="text-sm text-gray-200">${app.description}</p>
                <span class="mt-4 inline-block text-cyan-200 text-xs font-semibold group-hover:text-white">Truy Cập →</span>
            `;

            // Xử lý sự kiện click
            card.addEventListener('click', function() {
                if (app.embeddable) {
                    // Mở ứng dụng trong iframe
                    openEmbeddedApp(app);
                } else {
                    // Mở trong tab mới
                    window.open(app.url, '_blank');
                }
            });

            appGrid.appendChild(card);
        }

        // Hàm mở ứng dụng nhúng
        function openEmbeddedApp(app) {
            const container = document.getElementById(app.containerId);
            const iframe = document.getElementById(app.iframeId);
            
            iframe.src = app.url;
            container.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Ngăn cuộn trang nền
        }

        // Đóng ứng dụng nhúng
        document.querySelectorAll('.close-app').forEach(button => {
            button.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const container = document.getElementById(targetId);
                const iframe = container.querySelector('.app-iframe');
                
                container.style.display = 'none';
                iframe.src = 'about:blank';
                document.body.style.overflow = 'auto'; // Cho phép cuộn lại
            });
        });

        // Đóng bằng phím ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.querySelectorAll('.app-container').forEach(container => {
                    if (container.style.display === 'block') {
                        const iframe = container.querySelector('.app-iframe');
                        container.style.display = 'none';
                        iframe.src = 'about:blank';
                        document.body.style.overflow = 'auto';
                    }
                });
            }
        });

        // Tạo các hộp chức năng khi trang tải xong
        document.addEventListener('DOMContentLoaded', function() {
            apps.forEach(createAppBox);

            // Khởi tạo hiệu ứng nền 3D Vanta.js
            try {
                VANTA.CELLS({
                    el: "#vanta-bg",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 1.00,
                    color1: 0x00e5ff,      // Màu chính của tế bào (xanh cyan)
                    color2: 0x2a5c8c,      // Màu phụ của tế bào (xanh đậm hơn)
                    backgroundColor: 0x000010, // Màu nền (đen-xanh đậm)
                    size: 3.00,
                    speed: 1.00
                })
            } catch (e) {
                console.error("Lỗi khởi tạo Vanta.js:", e);
                // Fallback nếu Vanta.js lỗi
                document.body.style.backgroundColor = '#0c0a18';
            }
        });
    </script>

</body>
</html>
